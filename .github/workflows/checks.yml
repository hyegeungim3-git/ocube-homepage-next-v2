name: Checks

# 게이트를 '문서에 적힌 약속' 이 아니라 '자동으로 막는 것' 으로 만든다.
# 이어받는 사람이 무엇을 어겼는지 GitHub 에서 바로 본다.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # install 이 아니라 ci — 잠금 파일이 package.json 과 어긋나면 여기서 걸린다.
      # (실제로 이 검사가 없어서 클론한 사람만 막히는 결함을 늦게 발견했다)
      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:unit

      - run: npm run build

      # 직전 승인본(baseline/)과 DOM 이 같은지. 의도한 변경이면 baseline 을 함께 커밋해야 한다.
      - run: npm run verify

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
# ⚠️ test:visual 은 일부러 뺐다.
# 스크린샷 기준선이 Windows 에서 만들어졌고 글꼴 렌더링이 OS 마다 달라, Linux 러너에서
# 돌리면 실제 회귀가 아닌데도 전부 실패한다. 화면 그림 검사는 로컬에서 돌린다.
# CI 에서도 돌리려면 기준선을 Linux 컨테이너에서 다시 만들어야 한다(그때 이 주석을 지울 것).
