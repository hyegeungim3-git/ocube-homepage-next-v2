name: Deploy to GitHub Pages

# ⚠️ 이 저장소는 비공개다. 무료 플랜은 비공개 저장소에 Pages 를 켤 수 없어
# push 자동 실행을 꺼 두었다(켜 두면 매 push 마다 빨간 X 만 남는다).
# 공개로 바꾸면 아래 push 두 줄의 주석만 풀면 된다.
on:
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      # out/ 에 현재 사이트와 동일한 파일명으로 23페이지가 생성된다.
      # Pages 하위 경로(/저장소명)에 올라가므로 Next 런타임 청크 경로를 맞춰준다.
      - run: npm run build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      # Jekyll 처리를 막아 _ 로 시작하는 경로가 사라지지 않게 한다
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
